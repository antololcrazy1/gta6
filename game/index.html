<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="Vice Coast — a 3D open-world crime game in the spirit of GTA 6: explore a sun-soaked coastal city on foot and by car in third-person 3D, steal cars, dodge the Vice Coast PD (cars, foot cops and a police helicopter), and run a 10-mission story with golden-hour sunsets, gang turf wars, a shop and phone side jobs.">
<link rel="icon" href="data:,">
<title>Vice Coast — Open-World Crime Game (3D)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14101f; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .vc-hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff7e8; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  .vc-top-left { position: absolute; top: 12px; left: 12px; width: 340px; max-width: 46vw; }
  .vc-mission { background: rgba(12,10,24,.72); border-left: 4px solid #ffc93c; border: 1px solid rgba(255,255,255,.22); padding: 8px 10px; border-radius: 10px; }
  .vc-mission-title { font-weight: 900; font-size: 15px; letter-spacing: .5px; color: #ffc93c; }
  .vc-stage { display: inline-block; background: #ffc93c; color: #14101f; border-radius: 4px; padding: 1px 6px; font-size: 11px; font-weight: 900; margin-left: 6px; vertical-align: 2px; text-shadow: none; }
  .vc-mission-bar { height: 6px; background: rgba(255,255,255,.18); border-radius: 3px; margin: 5px 0; overflow: hidden; }
  .vc-mission-bar div { height: 100%; background: #ffc93c; width: 10%; }
  .vc-mission-obj { font-size: 13px; font-weight: 600; }
  .vc-mission-next { font-size: 12px; color: #ffd9a0; margin-top: 2px; }
  .vc-units { margin-top: 8px; background: rgba(12,10,24,.66); border: 1px solid rgba(255,255,255,.22); border-radius: 10px; padding: 6px 8px; font-size: 12px; }
  .vc-unit { display: flex; gap: 8px; padding: 2px 0; }
  .vc-unit b { color: #ff6b6b; min-width: 64px; }
  .vc-unit span { color: #ffd9a0; min-width: 76px; }
  .vc-unit i { font-style: normal; color: #fff; }
  .vc-unit em { font-style: normal; color: #ff9f43; margin-left: auto; }
  .vc-unit-more { color: #ffd9a0; padding-top: 2px; }
  .vc-top-right { position: absolute; top: 12px; right: 12px; text-align: right; }
  .vc-clock { font-size: 20px; font-weight: 800; }
  .vc-money { font-size: 26px; font-weight: 900; color: #7dff9a; }
  .vc-stars { font-size: 22px; letter-spacing: 2px; }
  .vc-stars span { color: rgba(255,255,255,.25); }
  .vc-stars span.lit { color: #ffc93c; }
  .vc-status { font-size: 12px; font-weight: 700; color: #7dff9a; margin-top: 6px; }
  .vc-wanted { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font-size: 30px; font-weight: 900; letter-spacing: 3px; color: #ffc93c; text-shadow: 0 2px 0 rgba(0,0,0,.6), 0 0 18px rgba(255,180,40,.55); display: none; }
  .vc-right { position: absolute; top: 134px; right: 12px; width: 190px; }
  .vc-weapon { display: flex; gap: 6px; align-items: center; background: rgba(12,10,24,.6); border: 1px solid rgba(255,255,255,.18); border-radius: 8px; padding: 3px 7px; margin-bottom: 3px; font-size: 12px; opacity: .55; }
  .vc-weapon.on { opacity: 1; border: 1px solid #ffc93c; }
  .vc-weapon svg { width: 28px; height: 14px; flex: none; fill: #fff; }
  .vc-weapon b { color: #ffc93c; }
  .vc-weapon i { font-style: normal; margin-left: auto; color: #fff; }
  .vc-crew-card { display: flex; gap: 7px; align-items: center; background: rgba(12,10,24,.6); border: 1px solid rgba(255,255,255,.18); border-radius: 8px; padding: 4px 7px; margin-bottom: 3px; font-size: 11px; }
  .vc-crew-face { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #14101f; text-shadow: none; flex: none; }
  .vc-crew-card b { display: block; color: #ffc93c; font-size: 11px; }
  .vc-crew-card span { color: #ffd9a0; }
  /* Phase 3: weapon slots + crew cards are tappable (the HUD root is
  pointer-events:none, so they opt back in); locked slots read LOCKED,
  the selected slot gets a green outline, cooling crew cards dim. */
  .vc-weapon, .vc-crew-card { cursor: pointer; pointer-events: auto; }
  .vc-weapon.locked { opacity: .4; }
  .vc-weapon.locked i { color: #ff6b6b; font-size: 10px; }
  .vc-weapon.sel { outline: 2px solid #7dff9a; }
  .vc-crew-card.cooling { opacity: .55; }
  /* Phase 3: rank label above the respect bar; nitro meter under the
  speedometer (car only); floating stunt popups; race overlay; touch
  weapon chip (top 240px clears the toast, dialog and buttons). */
  .vc-rank { font-size: 11px; font-weight: 800; color: #ffc93c; margin-bottom: 2px; letter-spacing: .5px; }
  .vc-nitro { width: 170px; height: 10px; background: rgba(255,255,255,.2); border-radius: 5px; margin: 4px 0 4px auto; overflow: hidden; position: relative; display: none; }
  .vc-nitro div { height: 100%; background: linear-gradient(90deg, #ff8c1a, #ffc93c); }
  .vc-nitro span { position: absolute; right: 4px; top: -1px; font-size: 8px; font-weight: 900; color: #14101f; text-shadow: none; }
  .vc-nitro.boosting div { background: linear-gradient(90deg, #ff5722, #ff8c1a); }
  .vc-stunts { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; }
  .vc-stunt { font-size: 22px; font-weight: 900; color: #7dff9a; text-shadow: 0 2px 0 rgba(0,0,0,.6); margin-bottom: 2px; white-space: nowrap; }
  .vc-race { position: absolute; top: 24%; left: 50%; transform: translateX(-50%); font-size: 24px; font-weight: 900; color: #ffd700; text-shadow: 0 2px 0 rgba(0,0,0,.6); display: none; text-align: center; white-space: nowrap; }
  .vc-weapon-chip { position: absolute; top: 240px; right: 12px; background: rgba(12,10,24,.7); border: 1px solid #ffc93c; border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 800; color: #fff7e8; display: none; pointer-events: auto; cursor: pointer; }
  body.vc-touch .vc-weapon-chip { display: block; }
  .vc-bottom-left { position: absolute; left: 12px; bottom: 12px; }
  .vc-district { font-size: 13px; font-weight: 700; margin-bottom: 3px; }
  .vc-respect { width: 180px; height: 5px; background: rgba(255,255,255,.2); border-radius: 3px; margin-bottom: 6px; overflow: hidden; }
  .vc-respect div { height: 100%; background: #ff6b9d; }
  .vc-minimap { width: 180px; height: 180px; border-radius: 50%; border: 3px solid rgba(255,255,255,.75); box-shadow: 0 0 0 3px rgba(0,0,0,.5); display: block; background: #20242e; }
  .vc-bars { margin-top: 6px; width: 180px; }
  .vc-bar { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; margin-top: 3px; }
  .vc-bar-track { flex: 1; height: 8px; background: rgba(255,255,255,.2); border-radius: 4px; overflow: hidden; }
  .vc-bar-health { height: 100%; background: #2ecc71; }
  .vc-bar-armor { height: 100%; background: #48dbfb; }
  .vc-dialog { position: absolute; left: 50%; transform: translateX(-50%); bottom: 14px; width: 360px; max-width: 44vw; display: flex; gap: 10px; background: rgba(12,10,24,.78); border: 1px solid rgba(255,255,255,.22); border-radius: 10px; padding: 7px 10px; align-items: center; }
  .vc-portrait { width: 44px; height: 44px; border-radius: 50%; background: #ff6b9d; color: #14101f; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; text-shadow: none; flex: none; }
  .vc-dialog-name { font-size: 12px; font-weight: 900; color: #ffc93c; }
  .vc-dialog-line { font-size: 13px; }
  .vc-bottom-right { position: absolute; right: 12px; bottom: 12px; text-align: right; }
  .vc-speed { font-size: 44px; font-weight: 900; line-height: 1; }
  .vc-speed small { font-size: 14px; color: #ffd9a0; }
  .vc-gear { display: inline-block; background: rgba(12,10,24,.7); border: 1px solid #ffc93c; border-radius: 3px; padding: 1px 8px; font-weight: 900; font-size: 13px; margin: 3px 0; }
  .vc-car { font-size: 13px; font-weight: 800; }
  .vc-cond { width: 170px; height: 6px; background: rgba(255,255,255,.2); border-radius: 3px; margin: 4px 0 4px auto; overflow: hidden; }
  .vc-cond div { height: 100%; background: #2ecc71; }
  .vc-radio { font-size: 12px; color: #ffd9a0; background: rgba(12,10,24,.6); padding: 3px 8px; border-radius: 3px; display: inline-block; }
  .vc-banner { position: absolute; top: 18%; left: 50%; transform: translateX(-50%); font-size: 26px; font-weight: 900; color: #ffc93c; text-align: center; display: none; letter-spacing: 1px; }
  .vc-district-banner { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); font-size: 18px; font-weight: 900; display: none; opacity: .85; }
  .vc-crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 26px; font-weight: 900; color: #fff; display: none; }
  .vc-hitmarker { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 34px; font-weight: 900; color: #ff3b30; opacity: 0; margin-top: -34px; }
  .vc-message { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); font-size: 13px; font-weight: 700; background: rgba(12,10,24,.7); padding: 3px 9px; border-radius: 4px; max-width: 46vw; text-align: center; }
  /* Touch devices: the right-hand HUD panel would sit under the action
  buttons, and the joystick would sit on the minimap — hide the panel and
  lift the minimap clear of the stick. */
  body.vc-touch .vc-right { display: none; }
  @media (orientation: portrait) {
    body.vc-touch .vc-bottom-left { bottom: 172px; }
    body.vc-touch .vc-message { top: 132px; }
    /* The crew dialogue was hidden on phones entirely — show it compact
    at the top (below the message toast) so phone players get the story. */
    body.vc-touch .vc-dialog { display: flex; top: 178px; bottom: auto; width: 260px; max-width: 54vw; padding: 6px 8px; }
    body.vc-touch .vc-portrait { width: 30px; height: 30px; font-size: 15px; }
    body.vc-touch .vc-dialog-line { font-size: 11px; }
  }
  @media (orientation: landscape) and (max-height: 500px) {
    body.vc-touch .vc-bottom-left { bottom: 128px; }
    body.vc-touch .vc-minimap { width: 96px; height: 96px; }
    body.vc-touch .vc-bars, body.vc-touch .vc-respect { width: 96px; }
    body.vc-touch .vc-district, body.vc-touch .vc-respect, body.vc-touch .vc-rank { display: none; }
  }
  .vc-shop, .vc-phone { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); background: rgba(12,10,24,.92); border: 2px solid #ffc93c; border-radius: 8px; padding: 14px 18px; display: none; font-size: 14px; pointer-events: auto; }
  .vc-shop b, .vc-phone b { display: block; color: #ffc93c; font-size: 16px; margin-bottom: 6px; }
  .vc-shop span, .vc-phone span { display: block; padding: 2px 0; }
  .vc-shop i, .vc-phone i { display: block; color: #ffd9a0; font-size: 12px; margin-top: 6px; }
  /* Tappable panel rows (touch): 44px-ish targets with a pressed state. */
  .vc-shop-row { display: block; padding: 10px; margin: 3px -8px; border-radius: 6px; cursor: pointer; }
  .vc-shop-row span { display: inline; color: #ffd9a0; font-size: 12px; }
  .vc-shop-row:active { background: rgba(255,201,60,.25); }
  .vc-shop-close { color: #ff9f43; text-align: center; font-weight: 700; }
  .vc-phone-job { color: #7dff9a; font-size: 12px; margin-bottom: 4px; }
  .vc-screens { position: fixed; inset: 0; z-index: 20; pointer-events: none; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .vc-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #fff7e8; background: linear-gradient(180deg, rgba(20,8,32,.55), rgba(20,8,32,.82)); pointer-events: auto; padding: 16px; }
  /* The win screen is a sunset finale: let the beach + sun show through. */
  #vc-screen-win { background: linear-gradient(180deg, rgba(20,8,32,.30), rgba(20,8,32,.55)); }
  .vc-logo { font-size: 84px; font-weight: 900; letter-spacing: 4px; line-height: .95; text-shadow: 0 4px 0 #ff5a3c, 0 8px 24px rgba(0,0,0,.6); }
  .vc-logo span { color: #ffc93c; }
  .vc-tagline { font-size: 16px; color: #ffd9a0; margin: 10px 0 18px; }
  .vc-title-stats { font-size: 14px; margin-bottom: 18px; color: #fff; }
  .vc-bigbtn { pointer-events: auto; font-size: 20px; font-weight: 900; letter-spacing: 1px; color: #14101f; background: #ffc93c; border: none; border-radius: 8px; padding: 14px 34px; margin: 6px; cursor: pointer; touch-action: manipulation; }
  .vc-bigbtn:active { background: #ffdf7a; }
  .vc-btn-ghost { background: rgba(255,255,255,.15); color: #fff7e8; border: 2px solid rgba(255,255,255,.5); }
  .vc-keys { font-size: 13px; color: #ffd9a0; margin-top: 14px; }
  .vc-brief-kicker { font-size: 15px; font-weight: 900; color: #ffc93c; letter-spacing: 2px; }
  .vc-brief-title { font-size: 52px; font-weight: 900; }
  .vc-brief-text { font-size: 17px; max-width: 560px; margin: 12px 0; line-height: 1.5; }
  .vc-brief-reward { font-size: 20px; font-weight: 900; color: #7dff9a; margin-bottom: 14px; }
  .vc-over-title { font-size: 72px; font-weight: 900; color: #ff3b30; text-shadow: 0 4px 0 rgba(0,0,0,.5); }
  .vc-win-title { color: #ffc93c; font-size: 52px; }
  @media (max-width: 760px), (orientation: portrait) {
    .vc-logo { font-size: 52px; }
    .vc-top-left { width: 250px; }
    .vc-mission-title { font-size: 12px; }
    .vc-mission-obj, .vc-mission-next { font-size: 11px; }
    .vc-units { display: none; }
    .vc-right { display: none; }
    .vc-minimap { width: 120px; height: 120px; }
    .vc-bars, .vc-respect { width: 120px; }
    .vc-dialog { display: none; }
    .vc-speed { font-size: 32px; }
    .vc-banner { font-size: 18px; }
    .vc-brief-title { font-size: 34px; }
    .vc-over-title { font-size: 44px; }
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Vice Coast: explore a coastal city on foot and by car in 3D, steal cars, dodge police, and run story missions"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
